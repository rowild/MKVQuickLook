name: MKVQuickLook
options:
  bundleIdPrefix: com.robertwildling
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 0.1.12
targets:
  MKVQuickLookApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MKVQuickLookApp/Sources
      - path: Shared/Sources
      # VLCKit is LGPL-2.1; ship its license text. Created by scripts/bootstrap-vlckit.sh.
      - path: Vendor/VLCKit-COPYING.txt
        buildPhase: resources
      # MIT requires the notice in every copy; the notices carry the LGPL source offer.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertwildling.MKVQuickLook
        PRODUCT_NAME: MKVQuickLook
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MKVQuickLookApp/Resources/Info.plist
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSMainNibFile: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: true
      - sdk: QuartzCore.framework
      - target: MKVQuickLookPreviewExtension
        embed: true
  MKVQuickLookPreviewExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MKVQuickLookPreviewExtension/Sources
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertwildling.MKVQuickLook.PreviewExtension
        PRODUCT_NAME: MKVQuickLookPreviewExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MKVQuickLookPreviewExtension/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MKVQuickLookPreviewExtension/MKVQuickLookPreviewExtension.entitlements
        # The build step below rewrites the linked binary in place.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../Frameworks"
          - "@loader_path/../Frameworks"
          - "@loader_path/../../Frameworks"
    dependencies:
      # Linked, not embedded: the app embeds VLCKit once, and the build step below
      # points the extension at the app's copy.
      - framework: Vendor/VLCKit.xcframework
        embed: false
      - sdk: Quartz.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CFNetwork.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework
      - sdk: libbz2.tbd
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libxml2.tbd
    postBuildScripts:
      - name: Load VLCKit from the app bundle
        script: "\"$SRCROOT/scripts/link-extension-to-app-vlckit.sh\""
        basedOnDependencyAnalysis: false

  MKVQuickLookTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertwildling.MKVQuickLookTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - framework: Vendor/VLCKit.xcframework
      - sdk: QuartzCore.framework
schemes:
  MKVQuickLook:
    build:
      targets:
        MKVQuickLookApp: all
        MKVQuickLookPreviewExtension: all
        MKVQuickLookTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MKVQuickLookTests
    archive:
      config: Release
